<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽签</title>
<style>
  :root {
    --bg1: #2b1a3d;
    --bg2: #1a1025;
    --paper: #fbf6ea;
    --ink: #3a2c1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-user-select: none;
    user-select: none;
  }
  .layout {
    width: 100%;
    max-width: 860px;
    display: flex;
    flex-wrap: wrap;
    gap: 56px;
    align-items: center;
    justify-content: center;
  }
  .left {
    flex: 0 0 auto;
    width: min(400px, 100%);
    text-align: center;
  }
  h1 {
    color: #f0d9a8;
    font-size: 34px;
    letter-spacing: 18px;
    text-indent: 18px;
    margin-bottom: 22px;
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .card {
    --level-color: #d8c9a5;
    background: var(--paper);
    border-radius: 20px;
    padding: 38px 24px 34px;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
    position: relative;
    transition: background .45s ease, box-shadow .3s;
  }
  .card.shaking {
    animation: shake .35s linear infinite;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-5px) rotate(-1.2deg); }
    40% { transform: translateX(5px) rotate(1.2deg); }
    60% { transform: translateX(-3px) rotate(-.8deg); }
    80% { transform: translateX(3px) rotate(.8deg); }
  }
  .card.reveal {
    animation: pop .55s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop {
    0% { transform: scale(.55); opacity: .2; }
    100% { transform: scale(1); opacity: 1; }
  }
  .label {
    color: #9a8a6a;
    font-size: 13px;
    letter-spacing: 6px;
    text-indent: 6px;
    margin-bottom: 8px;
    transition: color .3s;
  }
  .score {
    font-size: 88px;
    font-weight: 800;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    transition: color .3s;
  }
  .score-unit {
    font-size: 24px;
    font-weight: 600;
    color: #b3a27f;
    margin-left: 4px;
    transition: color .3s;
  }
  .level {
    display: inline-block;
    margin-top: 14px;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    padding: 6px 22px;
    border: 2px solid #d8c9a5;
    border-radius: 999px;
    letter-spacing: 4px;
    text-indent: 4px;
    transition: color .3s, border-color .3s, background .3s;
  }
  .tagline {
    margin-top: 14px;
    font-size: 13px;
    color: #8a7a5c;
    min-height: 20px;
    letter-spacing: 2px;
    transition: color .3s;
  }
  /* 抽到结果后整张卡片变色 */
  .card.colored { background: var(--level-color); }
  .card.colored .label,
  .card.colored .tagline { color: rgba(255,255,255,.85); }
  .card.colored .score { color: #fff; }
  .card.colored .score-unit { color: rgba(255,255,255,.8); }
  .card.colored .level {
    background: #fff;
    border-color: #fff;
    color: var(--level-color);
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 16px 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 10px;
    text-indent: 10px;
    color: #4a2f12;
    background: linear-gradient(180deg, #f5d78a, #e8b952);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 6px 0 #b98a2e, 0 12px 24px rgba(0,0,0,.3);
    transition: transform .08s, box-shadow .08s, filter .2s;
  }
  button:hover { filter: brightness(1.05); }
  button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #b98a2e, 0 6px 14px rgba(0,0,0,.3);
  }
  button:disabled {
    cursor: default;
    filter: saturate(.4) brightness(.9);
    transform: translateY(4px);
    box-shadow: 0 2px 0 #b98a2e, 0 6px 14px rgba(0,0,0,.3);
  }
  .hint {
    margin-top: 12px;
    font-size: 12px;
    color: rgba(240,217,168,.6);
    letter-spacing: 2px;
  }
  .right {
    flex: 0 0 220px;
    align-self: center;
  }
  .right h2 {
    color: #f0d9a8;
    font-size: 18px;
    letter-spacing: 6px;
    text-indent: 6px;
    text-align: center;
    margin-bottom: 16px;
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .levels {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .lvl-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #fff;
    padding: 11px 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
  }
  .lvl-name { letter-spacing: 3px; }
  .lvl-count {
    font-weight: 800;
    font-size: 18px;
    font-variant-numeric: tabular-nums;
  }
  .lvl-row.flash { animation: rowflash .45s ease; }
  @keyframes rowflash {
    0% { transform: scale(1); }
    45% { transform: scale(1.07); }
    100% { transform: scale(1); }
  }
  /* 全屏 67 特效 */
  .fx {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, rgba(80,45,20,.5), rgba(12,6,22,.94));
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
  }
  .fx.show { opacity: 1; pointer-events: auto; }
  .fx canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .fx-inner {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .fx-num {
    font-size: min(42vw, 300px);
    font-weight: 900;
    line-height: 1;
    color: #ffe066;
    text-shadow:
      0 0 8px #ffd54a,
      0 0 22px #ff9800,
      0 0 55px #ff5722,
      0 0 120px #ff5722;
  }
  .fx-num.boom {
    animation: fxpop .7s cubic-bezier(.18,1.5,.4,1), fxpulse 1.4s ease-in-out .7s infinite;
  }
  @keyframes fxpop {
    0% { transform: scale(0) rotate(-14deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes fxpulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  @media (max-width: 640px) {
    body { align-items: flex-start; padding-top: 40px; }
    .layout { flex-direction: column; gap: 32px; }
    .right { flex: none; width: 100%; max-width: 400px; }
  }
</style>
</head>
<body>
  <div class="layout">
    <div class="left">
      <h1>抽 签</h1>
      <div class="card" id="card">
        <div class="label">签 运</div>
        <div>
          <span class="score" id="score">?</span><span class="score-unit">分</span>
        </div>
        <div class="level" id="level">点击下方按钮开始</div>
        <div class="tagline" id="tagline"></div>
      </div>
      <button id="drawBtn">抽 签</button>
      <div class="hint">按空格键可抽签</div>
    </div>
    <div class="right">
      <h2>签运统计</h2>
      <div class="levels" id="levels"></div>
    </div>
  </div>

  <div class="fx" id="fx">
    <canvas id="fxCanvas"></canvas>
    <div class="fx-inner">
      <div class="fx-num" id="fxNum">67</div>
    </div>
  </div>

<script>
  const LEVELS = [
    { min: 90, name: '大吉', color: '#d62828', tagline: '万事亨通，心想事成' },
    { min: 70, name: '小吉', color: '#e8883a', tagline: '渐入佳境，诸事顺遂' },
    { min: 45, name: '中平', color: '#2a9d8f', tagline: '平淡是真，稳中有进' },
    { min: 20, name: '小凶', color: '#5f6c7b', tagline: '宜静不宜动，谨言慎行' },
    { min: 5,  name: '大凶', color: '#6d28d9', tagline: '韬光养晦，静待时机' },
    { min: 0,  name: '极凶', color: '#111827', tagline: '诸事不宜，宜守不宜攻' }
  ];

  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const taglineEl = document.getElementById('tagline');
  const levelsEl = document.getElementById('levels');
  const card = document.getElementById('card');
  const btn = document.getElementById('drawBtn');
  const fx = document.getElementById('fx');
  const fxNum = document.getElementById('fxNum');
  const fxCanvas = document.getElementById('fxCanvas');
  const fxCtx = fxCanvas.getContext('2d');

  let drawing = false;
  const levelCounts = LEVELS.map(() => 0);

  function getLevelIndex(score) {
    for (let i = 0; i < LEVELS.length; i++) if (score >= LEVELS[i].min) return i;
    return LEVELS.length - 1;
  }

  // 常驻显示 6 个等级行
  LEVELS.forEach((l) => {
    const row = document.createElement('div');
    row.className = 'lvl-row';
    row.style.background = l.color;
    const name = document.createElement('span');
    name.className = 'lvl-name';
    name.textContent = l.name;
    const count = document.createElement('span');
    count.className = 'lvl-count';
    count.textContent = '0次';
    row.append(name, count);
    levelsEl.appendChild(row);
  });

  function updateLevelCount(idx) {
    levelCounts[idx]++;
    const row = levelsEl.children[idx];
    row.querySelector('.lvl-count').textContent = levelCounts[idx] + '次';
    row.classList.remove('flash');
    void row.offsetWidth;
    row.classList.add('flash');
  }

  const FX_COLORS = ['#ffd54a', '#ff5252', '#ff9f43', '#ffffff', '#4dd0e1', '#ab47bc'];
  const FX_CONFIGS = {
    67: {
      num: '67',
      numColor: '#ffe066',
      numGlow: ['#ffd54a', '#ff9800', '#ff5722', '#ff5722'],
      textPool: ['67', 'SIX SEVEN'],
      textColors: ['rgba(103,232,249,0.85)', 'rgba(255,255,255,0.75)', 'rgba(255,213,74,0.85)'],
      burstColors: FX_COLORS,
      mode: 'center'
    },
    100: {
      num: '100',
      numColor: '#ffd54a',
      numGlow: ['#fff176', '#ffb300', '#ff7043', '#ff1744'],
      textPool: ['100', 'PERFECT', '满分'],
      textColors: ['rgba(255,213,74,0.9)', 'rgba(255,255,255,0.8)', 'rgba(255,138,101,0.85)'],
      burstColors: ['#ffd54a', '#ff5252', '#ff8a65', '#ffffff', '#ffb74d', '#fff176'],
      mode: 'firework'
    },
    0: {
      num: '0',
      numColor: '#cfcfcf',
      numGlow: ['#e0e0e0', '#9e9e9e', '#757575', '#424242'],
      textPool: ['0', 'ZERO', '归零', '空'],
      textColors: ['rgba(190,190,190,0.85)', 'rgba(255,255,255,0.7)', 'rgba(130,130,130,0.8)'],
      burstColors: ['#bdbdbd', '#9e9e9e', '#757575'],
      mode: 'center'
    }
  };
  const GLOW_RADII = [8, 22, 55, 120];

  let particles = [];
  let rockets = [];
  let floaters = [];
  let fxRunning = false;
  let fxPlaying = false;
  let fxHideTimer = null;
  let fxBurstTimer = null;
  let fxCleanupTimer = null;
  let fxConfig = null;

  const FX67_IMAGE_SRCS = [
    'images/fx67-0.webp',
    'images/fx67-1.webp',
    'images/fx67-2.webp',
    'images/fx67-3.webp',
    'images/fx67-4.webp',
    'images/fx67-5.webp',
    'images/fx67-6.webp',
    'images/fx67-7.webp',
    'images/fx67-8.webp',
    'images/fx67-9.webp',
  ];
  const fx67Images = FX67_IMAGE_SRCS.map(src => {
    const im = new Image();
    im.src = src;
    return im;
  });

  // 预烘焙发光：一次性把带阴影的图烤到离屏 canvas，避免每帧 shadowBlur 卡顿
  const GLOW_PAD = 140;
  const fx67Glows = [];
  function ensureGlows() {
    if (fx67Glows.length === fx67Images.length) return;
    fx67Glows.length = 0;
    for (const im of fx67Images) {
      if (!im.naturalWidth) continue;
      const nw = im.naturalWidth, nh = im.naturalHeight;
      const c = document.createElement('canvas');
      c.width = nw + GLOW_PAD * 2;
      c.height = nh + GLOW_PAD * 2;
      const g = c.getContext('2d');
      g.shadowColor = 'rgba(255, 213, 74, 0.85)';
      g.shadowBlur = 26;
      g.drawImage(im, GLOW_PAD, GLOW_PAD, nw, nh);
      fx67Glows.push({ canvas: c, nw, nh });
    }
  }
  let fxImgSprites = [];
  let fxFrame = 0;

  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function initFxImgSprites() {
    ensureGlows();
    fxImgSprites = [];
    const now = fxFrame;
    const cx = fxCanvas.width / 2;
    const cy = fxCanvas.height / 2;
    const exR = Math.max(170, Math.min(fxCanvas.width, fxCanvas.height) * 0.28);
    const cols = 5, rows = 2;
    const cellW = fxCanvas.width / cols;
    const cellH = fxCanvas.height / rows;
    const order = Array.from({ length: fx67Glows.length }, (_, i) => i);
    for (let k = order.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [order[k], order[j]] = [order[j], order[k]];
    }
    const total = Math.min(fx67Glows.length, cols * rows);
    for (let i = 0; i < total; i++) {
      const g = fx67Glows[order[i]];
      const size = 60 + Math.random() * 110;
      const ar = g.nw / g.nh;
      const w = ar >= 1 ? size : size * ar;
      const h = ar >= 1 ? size / ar : size;
      const col = i % cols;
      const row = Math.floor(i / cols);
      let x, y, tries = 0;
      do {
        x = col * cellW + cellW * (0.12 + Math.random() * 0.76);
        y = row * cellH + cellH * (0.12 + Math.random() * 0.76);
        tries++;
      } while (tries < 50 && Math.hypot(x - cx, y - cy) < exR + size / 2);
      x = Math.max(w / 2 + 10, Math.min(fxCanvas.width - w / 2 - 10, x));
      y = Math.max(h / 2 + 10, Math.min(fxCanvas.height - h / 2 - 10, y));
      fxImgSprites.push({
        glow: g.canvas, gW: g.canvas.width, gH: g.canvas.height, nw: g.nw,
        w, h, x, y,
        vx: (Math.random() - 0.5) * 0.9,
        vy: (Math.random() - 0.5) * 0.9,
        baseAngle: (Math.random() * 22 - 11) * Math.PI / 180,
        rotAmp: 4 * Math.PI / 180,
        rotPhase: Math.random() * Math.PI * 2,
        rotSpeed: 0.02 + Math.random() * 0.03,
        bobPhase: Math.random() * Math.PI * 2,
        bobSpeed: 0.02 + Math.random() * 0.02,
        bobAmp: 4 + Math.random() * 7,
        born: now - i * 7
      });
    }
  }

  function resizeFx() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeFx);
  resizeFx();

  function initFloaters() {
    floaters = [];
    const count = 60;
    const cols = Math.max(1, Math.ceil(Math.sqrt(count * (fxCanvas.width / fxCanvas.height))));
    const rows = Math.ceil(count / cols);
    const cellW = fxCanvas.width / cols;
    const cellH = fxCanvas.height / rows;
    for (let i = 0; i < count; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      floaters.push({
        x: col * cellW + cellW * (0.15 + Math.random() * 0.7),
        y: row * cellH + cellH * (0.15 + Math.random() * 0.7),
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        size: 16 + Math.random() * 56,
        text: fxConfig.textPool[Math.floor(Math.random() * fxConfig.textPool.length)],
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.02,
        color: fxConfig.textColors[Math.floor(Math.random() * fxConfig.textColors.length)],
        alpha: 0.25 + Math.random() * 0.5
      });
    }
  }

  function spawnBurst() {
    const cx = fxCanvas.width / 2;
    const cy = fxCanvas.height / 2;
    for (let i = 0; i < 180; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * 14;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 4 + Math.random() * 8,
        color: fxConfig.burstColors[Math.floor(Math.random() * fxConfig.burstColors.length)],
        life: 1,
        decay: 0.006 + Math.random() * 0.016,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.3,
        rect: Math.random() < 0.5
      });
    }
  }

  function spawnRocket() {
    rockets.push({
      x: Math.random() * fxCanvas.width,
      y: fxCanvas.height + 5,
      vx: (Math.random() - 0.5) * 1.2,
      vy: -(12 + Math.random() * 5),
      color: fxConfig.burstColors[Math.floor(Math.random() * fxConfig.burstColors.length)]
    });
  }

  function explode(x, y, color) {
    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 5;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 3 + Math.random() * 5,
        color,
        life: 1,
        decay: 0.01 + Math.random() * 0.02,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.3,
        rect: Math.random() < 0.5
      });
    }
  }

  function fxLoop() {
    if (!fxRunning) return;
    fxFrame++;
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

    for (const f of floaters) {
      f.x += f.vx;
      f.y += f.vy;
      f.rot += f.vr;
      const m = 140;
      if (f.x < -m) f.x = fxCanvas.width + m;
      if (f.x > fxCanvas.width + m) f.x = -m;
      if (f.y < -m) f.y = fxCanvas.height + m;
      if (f.y > fxCanvas.height + m) f.y = -m;
      fxCtx.save();
      fxCtx.globalAlpha = f.alpha;
      fxCtx.translate(f.x, f.y);
      fxCtx.rotate(f.rot);
      fxCtx.fillStyle = f.color;
      fxCtx.font = '800 ' + f.size + 'px "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
      fxCtx.textAlign = 'center';
      fxCtx.textBaseline = 'middle';
      fxCtx.fillText(f.text, 0, 0);
      fxCtx.restore();
    }

    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx;
      r.y += r.vy;
      r.vy += 0.08;
      if (r.vy > -1.5) {
        explode(r.x, r.y, r.color);
        rockets.splice(i, 1);
        continue;
      }
      fxCtx.save();
      fxCtx.globalAlpha = 1;
      fxCtx.fillStyle = r.color;
      fxCtx.beginPath();
      fxCtx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.globalAlpha = 0.4;
      fxCtx.beginPath();
      fxCtx.arc(r.x - r.vx * 2, r.y - r.vy * 2, 2, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.restore();
    }

    particles = particles.filter(p => p.life > 0);
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18;
      p.life -= p.decay;
      p.rot += p.vr;
      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, p.life);
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rot);
      fxCtx.fillStyle = p.color;
      if (p.rect) {
        fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.55);
      } else {
        fxCtx.beginPath();
        fxCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.restore();
    }
    for (const s of fxImgSprites) {
      const hw = s.w / 2, hh = s.h / 2;
      s.x += s.vx;
      s.y += s.vy;
      if (s.x < hw) { s.x = hw; s.vx = Math.abs(s.vx); }
      if (s.x > fxCanvas.width - hw) { s.x = fxCanvas.width - hw; s.vx = -Math.abs(s.vx); }
      if (s.y < hh) { s.y = hh; s.vy = Math.abs(s.vy); }
      if (s.y > fxCanvas.height - hh) { s.y = fxCanvas.height - hh; s.vy = -Math.abs(s.vy); }
      const age = fxFrame - s.born;
      let scale = 0;
      if (age >= 0) scale = easeOutBack(Math.min(1, age / 24));
      const bob = Math.sin(fxFrame * s.bobSpeed + s.bobPhase) * s.bobAmp;
      const rot = s.baseAngle + Math.sin(fxFrame * s.rotSpeed + s.rotPhase) * s.rotAmp;
      const k = s.w / s.nw;
      const W = s.gW * k, H = s.gH * k;
      fxCtx.save();
      fxCtx.translate(s.x, s.y + bob);
      fxCtx.rotate(rot);
      fxCtx.scale(scale, scale);
      fxCtx.drawImage(s.glow, -W / 2, -H / 2, W, H);
      fxCtx.restore();
    }
    if (fxRunning && (particles.length > 0 || floaters.length > 0 || rockets.length > 0 || fxImgSprites.length > 0)) {
      requestAnimationFrame(fxLoop);
    } else {
      fxRunning = false;
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    }
  }

  function playFx(num) {
    fxConfig = FX_CONFIGS[num];
    fxNum.textContent = fxConfig.num;
    fxNum.style.fontSize = fxConfig.numSize || '';
    fxNum.style.color = fxConfig.numColor;
    fxNum.style.textShadow = fxConfig.numGlow.map((c, i) => '0 0 ' + GLOW_RADII[i] + 'px ' + c).join(', ');
    fxPlaying = true;
    fx.classList.add('show');
    fxNum.classList.remove('boom');
    void fxNum.offsetWidth;
    fxNum.classList.add('boom');
    particles.length = 0;
    rockets.length = 0;
    initFloaters();
    if (num === 67) initFxImgSprites(); else fxImgSprites = [];
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxLoop); }
    clearInterval(fxBurstTimer);
    if (fxConfig.mode === 'firework') {
      spawnRocket();
      let n = 1;
      fxBurstTimer = setInterval(() => {
        spawnRocket();
        if (++n >= 24) clearInterval(fxBurstTimer);
      }, 150);
    } else {
      spawnBurst();
      let n = 1;
      fxBurstTimer = setInterval(() => {
        spawnBurst();
        if (++n >= 6) clearInterval(fxBurstTimer);
      }, 280);
    }
    clearTimeout(fxHideTimer);
    clearTimeout(fxCleanupTimer);
    fxHideTimer = setTimeout(() => hideFx(), 3200);
  }

  function hideFx() {
    fxPlaying = false;
    clearTimeout(fxHideTimer);
    clearInterval(fxBurstTimer);
    fx.classList.remove('show');
    clearTimeout(fxCleanupTimer);
    fxCleanupTimer = setTimeout(() => {
      floaters = [];
      particles = [];
      rockets = [];
      fxImgSprites = [];
    }, 420);
  }

  function showResult(score) {
    const idx = getLevelIndex(score);
    const level = LEVELS[idx];
    scoreEl.textContent = score;
    levelEl.textContent = level.name;
    taglineEl.textContent = level.tagline;
    card.style.setProperty('--level-color', level.color);
    card.classList.add('colored');
    updateLevelCount(idx);
    if (score === 67) playFx(67);
    else if (score === 100) playFx(100);
    else if (score === 0) playFx(0);
  }

  function doDraw(forceScore) {
    if (drawing || fxPlaying) return;
    drawing = true;
    btn.disabled = true;
    btn.textContent = '抽签中…';
    card.classList.add('shaking');
    taglineEl.textContent = '';

    const rollTimer = setInterval(() => {
      scoreEl.textContent = Math.floor(Math.random() * 101);
    }, 60);

    const duration = 1000 + Math.random() * 1000;
    setTimeout(() => {
      clearInterval(rollTimer);
      const score = forceScore != null ? forceScore : Math.floor(Math.random() * 101);
      showResult(score);
      card.classList.remove('shaking');
      card.classList.add('reveal');
      setTimeout(() => card.classList.remove('reveal'), 550);
      drawing = false;
      btn.disabled = false;
      btn.textContent = '再抽一次';
    }, duration);
  }

  btn.addEventListener('click', () => doDraw(null));

  let keyBuffer = '';
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      if (drawing) return;
      let cheatScore = null;
      if (keyBuffer.endsWith('sixseven')) cheatScore = 67;
      else if (keyBuffer.endsWith('onehundred')) cheatScore = 100;
      else if (keyBuffer.endsWith('zerobadzero')) cheatScore = 0;
      if (cheatScore != null) keyBuffer = '';
      doDraw(cheatScore);
      return;
    }
    if (e.key && e.key.length === 1 && /[a-z]/i.test(e.key)) {
      keyBuffer = (keyBuffer + e.key.toLowerCase()).slice(-11);
    }
  });

  window.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
